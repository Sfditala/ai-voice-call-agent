<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="A voice agent that picks up, answers, and books. ElevenLabs runs the call, n8n runs the actions over MCP."><style>.pulse{animation:p 5.5s infinite both}.dot{offset-path:path('M120 244 H1110');animation:m 5.5s infinite linear}.w{animation:w 1s ease-in-out infinite;transform-origin:center;transform-box:fill-box}@keyframes m{0%{offset-distance:0%;opacity:0}4%{opacity:1}86%{offset-distance:100%;opacity:1}92%,100%{offset-distance:100%;opacity:0}}@keyframes p{0%,100%{stroke:#3a3a3a}6%,16%{stroke:#2dd4bf}26%{stroke:#3a3a3a}}@keyframes w{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}@media (prefers-reduced-motion:reduce){.pulse,.dot,.w{animation:none}.dot{opacity:0}}</style><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".07"/></pattern></defs><rect width="1200" height="340" rx="18" fill="#0a0a0a"/><rect width="1200" height="340" rx="18" fill="url(#g)"/><text x="60" y="100" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="56" font-weight="650" letter-spacing="-2" fill="#f5f5f5">A voice agent that <tspan fill="#2dd4bf">picks up and books.</tspan></text><text x="62" y="146" font-family="Consolas, Menlo, monospace" font-size="19" fill="#a1a1a1">ElevenLabs runs the call. n8n runs the actions, over MCP. It never guesses.</text><path d="M120 244 H1110" stroke="#fff" stroke-opacity=".22" stroke-width="2"/><rect class="pulse" style="animation-delay:0.0s" x="90" y="214" width="60" height="60" rx="14" fill="#161616" stroke="#3a3a3a" stroke-width="2"/><circle cx="120" cy="244" r="8" fill="#ef5a66"/><text x="120" y="302" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#d0d0d0">Caller</text><rect class="pulse" style="animation-delay:0.9s" x="300" y="214" width="60" height="60" rx="14" fill="#161616" stroke="#3a3a3a" stroke-width="2"/><circle cx="330" cy="244" r="8" fill="#e6e6e6"/><text x="330" y="302" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#d0d0d0">ElevenLabs voice</text><rect class="pulse" style="animation-delay:1.8s" x="510" y="214" width="60" height="60" rx="14" fill="#161616" stroke="#3a3a3a" stroke-width="2"/><circle cx="540" cy="244" r="8" fill="#f5c04e"/><text x="540" y="302" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#d0d0d0">Agent + CV</text><rect class="pulse" style="animation-delay:2.7s" x="720" y="214" width="60" height="60" rx="14" fill="#161616" stroke="#3a3a3a" stroke-width="2"/><circle cx="750" cy="244" r="8" fill="#ff9f5a"/><text x="750" y="302" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#d0d0d0">MCP</text><rect class="pulse" style="animation-delay:3.6s" x="930" y="214" width="60" height="60" rx="14" fill="#161616" stroke="#3a3a3a" stroke-width="2"/><circle cx="960" cy="244" r="8" fill="#63b3ff"/><text x="960" y="302" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#d0d0d0">n8n tools</text><rect class="pulse" style="animation-delay:4.5s" x="1080" y="214" width="60" height="60" rx="14" fill="#161616" stroke="#3a3a3a" stroke-width="2"/><circle cx="1110" cy="244" r="8" fill="#2dd4bf"/><text x="1110" y="302" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#d0d0d0">Lead saved</text><circle class="dot" r="8" fill="#2dd4bf"/></svg>